<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Créer un Utilisateur</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-blue-100 via-purple-100 to-indigo-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-indigo-700 mb-6">👤 Créer un Utilisateur</h2>

    <form method="POST" action="connexion_utilisateur/">
      {% csrf_token %}

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nom complet</label>
        <input type="text" name="nom" placeholder="Le Boy Poser"
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        <p class="text-sm text-gray-500 mt-1">Veuillez entrer votre nom complet.</p>
      </div>

      <div class="mb-4">
        <label for="telephone" class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">+237</span>
          <input type="text" name="telephone" id="telephone" placeholder="6xx xxx xxx"
                 class="w-full pl-14 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <p class="text-sm text-gray-500 mt-1">Numéro au format local (ex: 6xx xxx xxx).</p>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
        <input type="text" name="adresse" placeholder="Ex: Douala, Bonamoussadi"
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Rôle</label>
        <select name="role" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
          <option value="" disabled selected>Choisir un rôle</option>
          <option value="admin">Administrateur</option>
          <option value="user">Utilisateur</option>
        </select>
        <p class="text-sm text-gray-500 mt-1">Choisissez un rôle pour ce nouvel utilisateur.</p>
      </div>

      <button type="submit"
              class="w-full bg-green-600 text-white font-semibold py-3 rounded-lg hover:bg-green-700 transition">
        ✅ Enregistrer
      </button>

      <div class="text-center mt-4">
        <a href="{% url 'verifiCon' %}" class="text-indigo-600 hover:underline text-sm font-medium">🔐 Déjà inscrit ? Se connecter</a>
      </div>

      {% for messages in messages %}
        <p class="mt-3 text-center text-sm text-red-500">{{ messages }}</p>
      {% endfor %}
    </form>
  </div>

</body>
</html>
