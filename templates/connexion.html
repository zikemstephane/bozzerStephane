{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/connexion.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="form-container">
    <form method="post" class="login-form" action="{% url 'connexion' %}">
        {% csrf_token %}
        <h2><i class="fas fa-user-circle"></i> Connexion</h2>

        {% if erreur %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i> {{ erreur }}
            </div>
        {% endif %}

        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="Adresse email" required>
        </div>

        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" name="mot_de_passe" placeholder="Mot de passe" required>
        </div>

        <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Se connecter</button>

        <a href="{% url 'index' %}" class="signup-link">
            <i class="fas fa-user-plus"></i> Pas encore de compte ? Créez-en un
        </a>
    </form>
    {% if messages%}
    <div class="message">
        <i class="fas fa-info-circle"></i> {{ messages }}
    {% endif %}
</div>

</body>
</html>
