<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <form method="post" action="{% url 'verifier_connection' %}" class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    {% csrf_token %}
    <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">📝 Inscription</h2>

    <div class="mb-4">
      <label for="nom" class="block text-sm font-medium text-gray-700 mb-1">Nom complet</label>
      <input type="text" name="nom" id="nom" placeholder="Jean Dupont"
             class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
      <p class="text-sm text-gray-500 mt-1">Veuillez entrer votre nom et prénom</p>
    </div>

    <div class="mb-6">
      <label for="telephone" class="block text-sm font-medium text-gray-700 mb-1">Numéro de téléphone</label>
      <input type="tel" name="telephone" id="telephone" placeholder="+237 6 72 34 56 78"
             class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
      <p class="text-sm text-gray-500 mt-1">Format attendu : +237 suivi de votre numéro</p>
    </div>

    <button type="submit"
            class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">
      ✅ Envoyer
    </button>

  </form>

</body>
</html>
