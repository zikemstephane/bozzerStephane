<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Confirmer la suppression</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
  <div class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold mb-4">Confirmer la suppression</h1>
    <p>Êtes-vous sûr de vouloir supprimer l'événement "{{ event.titre }}" ? Cette action est irréversible.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="px-6 py-2 bg-red-600 text-white rounded-xl">Supprimer</button>
      <a href="{% url 'dashbordAdmin' %}" class="ml-4 text-indigo-600">Annuler</a>
    </form>
  </div>
</body>
</html>
