{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{%static 'css/dashbord.css'%}">
    <title>Document</title>
</head>
<body>
    <div class="dashboard-container">
      <aside class="sidebar">
        <h2>Tableau de bord</h2>
        <ul class="menu">
          <li class="active"><i class="icon">📋</i> Tableau de bord</li>
          <li>
            <a href="{% url 'formQuartier' %}"><i class="icon">➕</i> Créer Quartier</a>
          </li>
          <li>
            <a href="{% url 'formMaison' %}"><i class="icon">🏠</i> Créer Maison</a>
          </li>
          <li>
            <a href="{%url 'formCategorie'%}"><i class="icon">🔲</i> Créer Catégorie</a>
          </li>
        </ul>
      </aside>
  
      <main class="main-content">
        <h1 class="title" style="text-transform: uppercase;">TABLEAU DE BORD DE GESTION DES QUARTIERS DE Mr {{username}}</h1>
  
        <div class="cards">
          <div class="card">
            <i class="card-icon location">📍</i>
            <div class="card-info">
              <h2>{{quartiers}}</h2>
              <p>Quartiers</p>
            </div>
            <button>
              <a href="{% url 'listerQuartier'%}">Voir plus <img src="{%static 'images/voirPlus.png'%}" height="20px"></a>
            </button>
          </div>
          <div class="card">
            <i class="card-icon house">🏠</i>
            <div class="card-info">
              <h2>{{kwatt}}</h2>
              <p>Maisons</p>
            </div>
            <button>
              <a href="{%url 'listerMaison'%}">Voir plus <img src="{%static 'images/voirPlus.png'%}" height="20px"></a>
            </button>
          </div>
          <div class="card">
            <i class="card-icon people">👥</i>
            <div class="card-info">
              <h2>8,250</h2>
              <p>Population</p>
            </div>
          </div>
          <div class="card">
            <i class="card-icon category">🔲</i>
            <div class="card-info">
              <h2>{{categories}}</h2>
              <p>Catégories</p>
            </div>
            <button>
              <a href="{%url 'listerCategorie'%}">Voir plus <img src="{%static 'images/voirPlus.png'%}" height="20px"></a>
            </button>
          </div>
        </div>
      </main>
    </div>
  </body>
  
</html>
