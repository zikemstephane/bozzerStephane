<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription à un Événement</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-2xl bg-white shadow-xl rounded-3xl p-8 sm:p-10">
        <h2 class="text-2xl sm:text-3xl font-bold text-center text-indigo-700 mb-2">📋 Inscription à un événement</h2>
        <p class="text-center text-gray-600 mb-6">Remplissez le formulaire ci-dessous pour vous inscrire à l'un de nos événements passionnants.</p>

        <form method="post" action="{% url 'inscription_evenement' eveneme.id %}">
            {% csrf_token %}

            <!-- Nom de l'utilisateur -->
            <div class="mb-5">
                <label for="nom_utilisateur" class="block text-sm font-medium text-gray-700 mb-1">Nom de l'utilisateur</label>
                <input type="text" id="nom_utilisateur" name="nom_utilisateur" readonly value="{{username}}"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition">
            </div>

            <!-- Choix de l'événement -->
            <div class="mb-5">
                <label for="evenement" class="block text-sm font-medium text-gray-700 mb-1">Événement</label>
                <input type="text" id="id_evenement" name="event.id" value="{{ eveneme.titre }}"class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition" readonly >
            </div>

            <!-- Date d'inscription -->
            <div class="mb-6">
                <label for="date_inscription" class="block text-sm font-medium text-gray-700 mb-1">Date d'inscription</label>
                <input type="date" id="date_inscription" name="date_inscription" required
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition">
            </div>

            <!-- Bouton -->
            <div class="text-center">
                <button type="submit"
                    class="w-full sm:w-auto px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl shadow hover:bg-indigo-700 transition">
                    🚀 Participer maintenant
                </button>
            </div>
            

        </form>


    </div>

</body>
</html>
