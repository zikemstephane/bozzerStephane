{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{%static 'css/FormCategorie.css'%}">
    <title>Document</title>
</head>
<body>
    <main class="categorie-form-container">
        <h1 class="form-title">Créer une Nouvelle Catégorie</h1>
        <form class="form" method="post" action="{% url 'enregistreCategorie' %}" >
            {% csrf_token %}
          <label for="nom">Nom de la Catégorie</label>
          <input type="text" id="nom" name="nom" ngModel="categorie.nom" required>
      
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4" ngModel="categorie.description" required></textarea>
      
          <button type="submit">Enregistrer</button>
        </form>
      
        <div class="btn-group">
          <button><a href="{%url 'Dashbord'%}">Retour</a></button>
        </div>
      </main>
    </body>
</html>
