<main class="quartier-container">
  <h1 class="title"><i class="fas fa-map-marker-alt"></i> Liste des Quartiers que vous possédez</h1>

  <table class="table-quartiers">
    <thead>
      <tr>
        <th><i class="fas fa-signature"></i> Nom</th>
        <th><i class="fas fa-ruler-combined"></i> Superficie (m²)</th>
        <th><i class="fas fa-align-left"></i> Description</th>
        <th><i class="fas fa-tools"></i> Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let q of QUARTIERS_MOCK">
        <td>{{ q.nom }}</td>
        <td>{{ q.superficie }}</td>
        <td>{{ q.description }}</td>
        <td>
          <button class="btn-modifier"><i class="fas fa-pen"></i> Modifier</button>
          <button class="btn-supprimer"><i class="fas fa-trash"></i> Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="buttons-footer">
    <a href="/dashboard" class="btn-footer"><i class="fas fa-arrow-left"></i> Retour</a>
    <a href="/FormQuartier" class="btn-footer"><i class="fas fa-plus-circle"></i> Créer un Quartier</a>
  </div>
</main>
