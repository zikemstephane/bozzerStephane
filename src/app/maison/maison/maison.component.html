<body>
  <main class="maison-container">
    <h1 class="title"><i class="fas fa-house-user"></i> Liste des maisons que vous possédez</h1>

    <div class="main-card">
      <table class="maison-table">
        <thead>
          <tr>
            <th><i class="fas fa-city"></i> Quartier</th>
            <th><i class="fas fa-map-marker-alt"></i> Adresse</th>
            <th><i class="fas fa-ruler-combined"></i> Superficie</th>
            <th><i class="fas fa-tags"></i> Catégorie</th>
            <th><i class="fas fa-cogs"></i> Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let maison of maisonse">
            <td>{{ maison.Quartier }}</td>
            <td>{{ maison.adresse }}</td>
            <td>{{ maison.superficie }} m²</td>
            <td>{{ maison.categorie }}</td>
            <td class="button-group">
              <button class="btn modifier"><i class="fas fa-edit"></i> Modifier</button>
              <button class="btn supprimer"><i class="fas fa-trash"></i> Supprimer</button>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="nav-buttons">
        <a href="/dashboard" class="btn-nav">
          <i class="fas fa-arrow-left"></i> Retour
        </a>
        <a href="/FormMaison" class="btn-nav">
          <i class="fas fa-plus-circle"></i> Créer une maison
        </a>
      </div>
    </div>
  </main>
</body>
