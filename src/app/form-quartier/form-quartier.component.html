<div class="container mt-4">
  <h2><i class="fas fa-city"></i> Formulaire de Quartier</h2>

  <form>
    <div class="mb-3">
      <label for="nom" class="form-label"><i class="fas fa-signature"></i> Nom</label>
      <input type="text" class="form-control" id="nom" name="nom" required placeholder="Ex : Quartier Bastos">
    </div>

    <div class="mb-3">
      <label for="description" class="form-label"><i class="fas fa-align-left"></i> Description</label>
      <textarea class="form-control" id="description" name="description" rows="3" required placeholder="Décrivez le quartier..."></textarea>
    </div>

    <div class="mb-3">
      <label for="superficie" class="form-label"><i class="fas fa-ruler-combined"></i> Superficie (m²)</label>
      <input type="number" class="form-control" id="superficie" name="superficie" required placeholder="Ex : 1200">
    </div>

    <div class="mb-3">
      <label for="administrateur" class="form-label"><i class="fas fa-user-shield"></i> Administrateur</label>
      <select class="form-control" id="administrateur" name="administrateur" required>
        <option value="" disabled selected>-- Sélectionnez un administrateur --</option>
        <option value="admin">admin</option>
        <option value="stephane">stephane</option>
        <option value="licence">licence</option>
        <option value="zikem">zikem</option>
        <option value="kuete">kuete</option>
      </select>
    </div>

    <button type="submit" class="btn btn-success w-100">
      <i class="fas fa-save"></i> Enregistrer
    </button>

    <a href="/dashboard" class="btn btn-secondary w-100 mt-2">
      <i class="fas fa-arrow-left"></i> Retour au tableau de bord
    </a>
  </form>
</div>
